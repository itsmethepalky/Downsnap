<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - Downsnap</title>
<style>
/* General */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    max-width: 600px;
    width: 90%;
    padding: 40px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
}

/* Heading */
h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Message */
p {
    font-size: 18px;
    color: #cbd5f5;
    margin-bottom: 30px;
}

/* Button */
a.button {
    display: inline-block;
    padding: 12px 25px;
    background: #38bdf8;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    border-radius: 8px;
    transition: 0.3s;
}

a.button:hover {
    background: #0ea5e9;
    transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="container">
    <h1>Thank You!</h1>
    <p>Your message has been successfully sent. We will get back to you shortly.</p>
    <a href="{{ url_for('contact') }}" class="button">Back to Contact Page</a>
</div>
</body>
</html>
