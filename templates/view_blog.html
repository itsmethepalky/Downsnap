<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ blog.title }} - Downsnap</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
/* General Styles */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #fff;
}

/* Container */
.container {
    max-width: 800px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* Header */
.container h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(90deg,#38bdf8,#818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
}

/* Blog content */
.container p {
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: #cbd5f5;
}

/* Blog image */
.container img {
    max-width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

/* Social share buttons */
.share-text {
    font-weight: 600;
    margin-bottom: 10px;
    color: #cbd5f5;
}

.social-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    justify-content: center;
}

.social-buttons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #fff;
    text-decoration: none;
    transition: transform 0.2s;
}

.social-buttons a:hover {
    transform: scale(1.1);
}

.facebook { background: #3b5998; }
.twitter { background: #1da1f2; }
.linkedin { background: #0077b5; }
.whatsapp { background: #25d366; }
.telegram { background: #0088cc; }

/* Footer */
footer {
    margin-top: 60px;
    padding: 20px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>{{ blog.title }}</h1>
    <p>{{ blog.content }}</p>

    {% if blog.image_url %}
    <img src="{{ blog.image_url }}" alt="Blog Image">
    {% endif %}

    <p class="share-text">Share this post:</p>
    <div class="social-buttons">
        <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.url }}" class="facebook" target="_blank" aria-label="Share on Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://twitter.com/intent/tweet?url={{ request.url }}&text={{ blog.title }}" class="twitter" target="_blank" aria-label="Share on Twitter"><i class="fab fa-twitter"></i></a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ request.url }}" class="linkedin" target="_blank" aria-label="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://api.whatsapp.com/send?text={{ blog.title }} {{ request.url }}" class="whatsapp" target="_blank" aria-label="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://t.me/share/url?url={{ request.url }}&text={{ blog.title }}" class="telegram" target="_blank" aria-label="Share on Telegram"><i class="fab fa-telegram-plane"></i></a>
    </div>
</div>

<footer>
    © 2026 Downsnap. All rights reserved.
</footer>

</body>
</html>
