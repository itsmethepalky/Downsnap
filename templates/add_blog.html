<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Blog - Downsnap</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
/* General Styles */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #fff;
}

/* Container */
.container {
    max-width: 700px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* Header */
.container h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 40px;
    background: linear-gradient(90deg,#38bdf8,#818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Form Styles */
form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

label {
    font-weight: 600;
    color: #cbd5f5;
}

input[type="text"], textarea, input[type="file"] {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #64748b;
    background: #1e293b;
    color: #fff;
    font-size: 16px;
    width: 100%;
    transition: border 0.3s, background 0.3s;
}

input[type="text"]:focus, textarea:focus, input[type="file"]:focus {
    outline: none;
    border-color: #38bdf8;
    background: #0f172a;
}

/* Button */
button {
    padding: 12px 20px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}

button:hover {
    background: #0ea5e9;
    transform: translateY(-2px);
}

/* Footer */
footer {
    margin-top: 60px;
    padding: 20px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>Add a New Blog</h1>
    <form action="{{ url_for('add_blog') }}" method="post" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" name="title" placeholder="Enter blog title" required>

        <label for="content">Content:</label>
        <textarea name="content" rows="6" placeholder="Write your blog content..." required></textarea>

        <label for="image">Upload Image:</label>
        <input type="file" name="image">

        <button type="submit"><i class="fas fa-paper-plane"></i> Submit</button>
    </form>
</div>

<footer>
    © 2026 Downsnap. All rights reserved.
</footer>

</body>
</html>
